name = "sea-precheck-api"
account_id = "addfe3ccfd60594cc0e3f3aea07513b8"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[alias]
"@opentelemetry/api" = "./src/stubs/otel.ts"

[vars]
LLM_BASE_URL = "https://open.bigmodel.cn/api/coding/paas/v4"   # Coding Plan endpoint; pay-as-you-go: https://open.bigmodel.cn/api/paas/v4
LLM_MODEL = "glm-5.3-flash"
LLM_THINKING = "off"        # off | low | high (on = slower, needs more max_tokens)
# Comma-separated list of allowed browser origins (GitHub Pages origin, no path). For local dev add http://localhost:3000 via --var.
ALLOWED_ORIGINS = "https://shengshenlan.github.io"
AGENT_IMPL = "fetch"         # "pi" (pi-agent-core) or "fetch" (thin built-in loop)
REQUEST_TIMEOUT_MS = "55000"
# Vision (image facts). glm-5.3-flash (image_url data URI, thinking off) is the default; glm-4.6v also works on the Coding Plan endpoint (see eval/results/images-*.json). Mark→country mapping comes from the KB (src/lib/core/marks.ts), not the model.
VISION_BASE_URL = "https://open.bigmodel.cn/api/coding/paas/v4"
VISION_MODEL = "glm-5.3-flash"
# ---- Usage limits (protect the Zhipu Coding Plan). All daily counters live in D1 and reset at 00:00 UTC. See DEPLOY.md "限额". ----
CHECKS_PER_USER_PER_DAY = "10"   # checks per account per day (a multi-country check counts once). Old name DAILY_AI_QUOTA still works.
CHECKS_PER_IP_PER_DAY = "20"     # checks per IP per day
CHECKS_GLOBAL_PER_DAY = "300"    # checks site-wide per day -> "今日检查名额已用完，请明天再来"
MAX_COUNTRIES = "3"              # countries per check (max 3)
MAX_IMAGES = "5"                 # images per check (hard ceiling 10)
MAX_IMAGE_BYTES = "5242880"      # per image, decoded bytes (the client sends originals as they are; only an image over this is auto-compressed)
MAX_TOTAL_IMAGE_BYTES = "26214400" # all images of one check (5 × 5MB = 25MB decoded ≈ 33MB base64 JSON; see DEPLOY.md CPU / memory note)
VISION_TIMEOUT_MS = "25000"      # budget of the whole vision stage (images go in parallel batches of ≤4 images / ≤9MB; slow/failed batches are dropped)
INFO_MAX_CHARS = "10000"         # 商品信息 length (hard ceiling 10000)
REG_PER_IP_PER_DAY = "3"         # registrations per IP per day
PBKDF2_ITERATIONS = "100000" # workerd max is 100000
# Verification-code email (Brevo). The API key is a secret: wrangler secret put BREVO_API_KEY
MAIL_FROM = "zhu05361@gmail.com"   # must be a verified sender in Brevo
MAIL_FROM_NAME = "出海合规雷达"
MAIL_GLOBAL_PER_DAY = "250"   # verification emails site-wide per UTC day (Brevo free plan: 300/day)
MAIL_PER_EMAIL_PER_DAY = "5"  # codes per address per UTC day
MAIL_PER_IP_PER_DAY = "10"    # codes per IP per UTC day

# Free-tier Workers Rate Limiting API (per-minute bursts; approximate, counted per Cloudflare location). period must be 10 or 60 seconds.
# RL_IP = checks per IP per minute, RL_GLOBAL = checks site-wide per minute, RL_AUTH = login/register/send-code per IP per minute.
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1003"
simple = { limit = 6, period = 60 }

# Users + history. Create with: npx wrangler d1 create sea-precheck  -> paste the id below.
# Migrate: npx wrangler d1 migrations apply sea-precheck --remote   (local: --local)
[[d1_databases]]
binding = "DB"
database_name = "sea-precheck-db"
database_id = "00f899b5-2828-4217-be30-7b1a5cfdb001"
migrations_dir = "migrations"

# Secrets (never in this file):  wrangler secret put JWT_SECRET   (random 32+ bytes)
# Secret (never in this file):  wrangler secret put ZHIPUAI_API_KEY
# Secret (never in this file):  wrangler secret put BREVO_API_KEY
# Local dev: put ZHIPUAI_API_KEY=... in worker/.dev.vars (gitignored). Without BREVO_API_KEY, set DEV_MAIL_LOG=1 there
# to print verification codes to the wrangler console instead of sending mail (never set DEV_MAIL_LOG in production).
