<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:900px;overflow:hidden;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:#fff;position:relative;
 background:radial-gradient(900px 700px at 85% 10%,rgba(34,211,238,.28),transparent 60%),radial-gradient(900px 800px at 0% 100%,rgba(99,102,241,.45),transparent 60%),linear-gradient(135deg,#0d1030 0%,#161a4a 55%,#0f2a4d 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 70% 40%,#000 20%,transparent 80%)}
.rings{position:absolute;left:-260px;top:-260px;width:900px;height:900px;border-radius:50%;border:1px solid rgba(255,255,255,.07);box-shadow:0 0 0 110px rgba(255,255,255,0) , inset 0 0 0 110px rgba(255,255,255,0)}
.rings:before,.rings:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.rings:before{inset:120px}.rings:after{inset:240px}
.left{position:absolute;left:96px;top:0;bottom:0;width:690px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600;letter-spacing:.5px;color:#dfe5ff}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#06b6d4);display:grid;place-items:center;position:relative;box-shadow:0 10px 30px rgba(79,70,229,.55)}
.logo i{position:absolute;right:-3px;top:-3px;width:14px;height:14px;border-radius:50%;background:#34d399;border:3px solid #161a4a}
h1{margin-top:44px;font-size:104px;line-height:1.08;font-weight:800;letter-spacing:4px;background:linear-gradient(100deg,#fff 20%,#a5f3fc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:26px;font-size:42px;font-weight:500;color:#e8ecff;line-height:1.4}
.tag b{font-weight:700;color:#67e8f9}
.sub{margin-top:18px;font-size:23px;color:#a9b4e8;letter-spacing:.5px}
.flags{margin-top:48px;display:flex;gap:16px}
.flag{display:flex;align-items:center;gap:12px;padding:10px 22px 10px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:25px;font-weight:600;backdrop-filter:blur(6px)}
.flag svg{width:42px;height:28px;border-radius:5px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.right{position:absolute;right:0;top:0;width:800px;height:900px}
.browser{position:absolute;left:10px;top:200px;width:640px;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 50px 100px rgba(3,6,40,.65),0 0 0 1px rgba(255,255,255,.18);transform:perspective(1800px) rotateY(-7deg) rotateX(2deg);transform-origin:left center}
.bar{height:38px;background:#eef0f7;display:flex;align-items:center;gap:8px;padding:0 16px}
.bar span{width:12px;height:12px;border-radius:50%;background:#ff5f57}.bar span:nth-child(2){background:#febc2e}.bar span:nth-child(3){background:#28c840}
.bar em{margin-left:16px;flex:1;height:22px;border-radius:11px;background:#fff;font-style:normal;font-size:13px;color:#7b8199;display:flex;align-items:center;padding-left:14px;max-width:360px}
.browser img{display:block;width:640px;height:auto}
.phone{position:absolute;left:535px;top:360px;width:250px;border-radius:38px;background:#0b0d22;padding:9px;box-shadow:0 40px 80px rgba(3,6,40,.7),0 0 0 2px rgba(255,255,255,.22) inset,0 0 0 1px rgba(255,255,255,.1)}
.phone img{display:block;width:232px;height:490px;object-fit:cover;object-position:top;border-radius:30px}
.badge{position:absolute;right:60px;top:56px;display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:20px;color:#d7defc;letter-spacing:1px}
.badge i{width:10px;height:10px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399}
</style></head><body>
<div class="grid"></div><div class="rings"></div>
<div class="left">
 <div class="brand"><span class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg><i></i></span>SEA Compliance Radar</div>
 <h1>出海合规雷达</h1>
 <p class="tag">上架东南亚前，<b>先做合规预检</b></p>
 <p class="sub">结论 · 要办的证 · 下一步 · 官方来源，一次看清</p>
 <div class="flags">
  <div class="flag"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#A51931"/><rect y="3.33" width="30" height="13.33" fill="#F4F5F8"/><rect y="6.67" width="30" height="6.67" fill="#2D2A4A"/></svg>泰国</div>
  <div class="flag"><svg viewBox="0 0 30 20"><rect width="30" height="10" fill="#0038A8"/><rect y="10" width="30" height="10" fill="#CE1126"/><path d="M0 0 L17.3 10 L0 20 Z" fill="#fff"/><circle cx="5.8" cy="10" r="2.2" fill="#FCD116"/></svg>菲律宾</div>
  <div class="flag"><svg viewBox="0 0 28 14"><rect width="28" height="14" fill="#fff"/><g fill="#CC0001"><rect y="0" width="28" height="1"/><rect y="2" width="28" height="1"/><rect y="4" width="28" height="1"/><rect y="6" width="28" height="1"/><rect y="8" width="28" height="1"/><rect y="10" width="28" height="1"/><rect y="12" width="28" height="1"/></g><rect width="14" height="8" fill="#010066"/><circle cx="5.6" cy="4" r="2.9" fill="#FC0"/><circle cx="6.4" cy="4" r="2.4" fill="#010066"/><circle cx="10" cy="4" r="1.3" fill="#FC0"/></svg>马来西亚</div>
 </div>
</div>
<div class="right">
 <div class="badge"><i></i>真实检查结果 · 示例报告</div>
 <div class="browser"><div class="bar"><span></span><span></span><span></span><em>shengshenlan.github.io/sea-precheck/demo</em></div><img src="../screenshots/desktop-demo-crop.png"></div>
 <div class="phone"><img src="../screenshots/mobile-demo.png"></div>
</div>
</body></html>
